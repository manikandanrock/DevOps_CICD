<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      letter-spacing: 2px;
      color: #e2c97e;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 2rem;
      letter-spacing: 1px;
    }

    .score-row {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }

    .score-box {
      text-align: center;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 0.6rem 1.4rem;
    }

    .score-label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .score-num {
      font-size: 26px;
      font-weight: 700;
      margin-top: 2px;
    }

    .score-x { color: #5b8dee; }
    .score-o { color: #e2627e; }
    .score-d { color: #aaa; }

    .status {
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
      color: #ccc;
      min-height: 1.5rem;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      gap: 10px;
    }

    .cell {
      width: 110px;
      height: 110px;
      background: #16213e;
      border: 1.5px solid #2a2a5a;
      border-radius: 12px;
      font-size: 3rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      color: transparent;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #1f2d55;
      transform: scale(1.04);
    }

    .cell.taken { cursor: default; }

    .cell.x { color: #5b8dee; }
    .cell.o { color: #e2627e; }

    .cell.win {
      background: #2a3a6a;
      border-color: #e2c97e;
      box-shadow: 0 0 12px #e2c97e55;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 1.8rem;
    }

    button.action {
      padding: 0.55rem 1.4rem;
      border-radius: 8px;
      border: 1.5px solid #2a2a5a;
      background: #16213e;
      color: #ccc;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
      letter-spacing: 0.5px;
    }

    button.action:hover {
      background: #1f2d55;
      color: #fff;
    }
  </style>
</head>
<body>

  <h1>Tic Tac Toe</h1>
  <div class="subtitle">X vs O &mdash; Two Player</div>

  <div class="score-row">
    <div class="score-box">
      <div class="score-label">X Wins</div>
      <div class="score-num score-x" id="sx">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">Draws</div>
      <div class="score-num score-d" id="sd">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">O Wins</div>
      <div class="score-num score-o" id="so">0</div>
    </div>
  </div>

  <div class="status" id="status">X's turn</div>

  <div class="board" id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>

  <div class="btn-row">
    <button class="action" onclick="reset()">New Game</button>
    <button class="action" onclick="resetAll()">Reset Scores</button>
  </div>

  <script>
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let board = Array(9).fill(null);
    let turn = 'X';
    let over = false;
    let scores = { X: 0, O: 0, D: 0 };

    const allCells = () => document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');

    document.getElementById('board').addEventListener('click', e => {
      const cell = e.target.closest('.cell');
      if (!cell || over || cell.classList.contains('taken')) return;
      const i = +cell.dataset.i;
      board[i] = turn;
      cell.textContent = turn;
      cell.classList.add('taken', turn.toLowerCase());

      const winLine = checkWin();
      if (winLine) {
        winLine.forEach(j => allCells()[j].classList.add('win'));
        statusEl.textContent = turn + ' wins! 🎉';
        scores[turn]++;
        updateScores();
        over = true;
      } else if (board.every(Boolean)) {
        statusEl.textContent = "It's a draw!";
        scores.D++;
        updateScores();
        over = true;
      } else {
        turn = turn === 'X' ? 'O' : 'X';
        statusEl.textContent = turn + "'s turn";
      }
    });

    function checkWin() {
      for (const [a, b, c] of WINS) {
        if (board[a] && board[a] === board[b] && board[b] === board[c]) return [a, b, c];
      }
      return null;
    }

    function updateScores() {
      document.getElementById('sx').textContent = scores.X;
      document.getElementById('so').textContent = scores.O;
      document.getElementById('sd').textContent = scores.D;
    }

    function reset() {
      board = Array(9).fill(null);
      turn = 'X';
      over = false;
      allCells().forEach(c => {
        c.textContent = '';
        c.className = 'cell';
      });
      statusEl.textContent = "X's turn";
    }

    function resetAll() {
      scores = { X: 0, O: 0, D: 0 };
      updateScores();
      reset();
    }
  </script>
</body>
</html>
